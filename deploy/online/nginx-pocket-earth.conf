# Pocket Earth 决赛版 nginx 反代基础块（放 /etc/nginx/conf.d/）。
server {
    server_name pocketearth.throughtheglass.art;

    # 端侧视觉打分等接口可能上传 base64 图片，放宽请求体上限
    client_max_body_size 25m;

    # X-Content-Type-Options / X-Frame-Options / Referrer-Policy / Permissions-Policy
    # 由 server.mjs 统一设置，避免反代后重复响应头。HSTS 只能在 TLS 层设置。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3009;           # 与 .env / ecosystem.config.cjs 一致
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;                     # 云脑长回答留足时间
    }

    listen 80;
}
