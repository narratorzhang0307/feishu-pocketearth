server {
    listen 80;
    server_name assets-pocketearth.throughtheglass.art;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assets-pocketearth.throughtheglass.art;

    ssl_certificate /etc/letsencrypt/live/assets-pocketearth.throughtheglass.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets-pocketearth.throughtheglass.art/privkey.pem;

    location / {
        proxy_pass https://last-night-on-earth.oss-cn-hangzhou.aliyuncs.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name last-night-on-earth.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Host last-night-on-earth.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;

        # OSS default domains force media to download. The application needs
        # images/WASM as subresources, so expose the verified object inline.
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
